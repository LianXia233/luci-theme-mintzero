name: Build Package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0, nightly)'
        required: false
        default: 'nightly'

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || (github.event.inputs.release_tag || 'nightly') }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86/64
            suffix: x86_64
          - target: mediatek/filogic
            suffix: mediatek_filogic

    steps:
      - name: Checkout this repo (theme sources)
        uses: actions/checkout@v4

      - name: Checkout OpenWrt main
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git log -1 --format='OpenWrt main %h %cd'

      - name: Checkout LuCI master
        run: |
          cd openwrt
          git clone --depth 1 https://github.com/openwrt/luci.git feeds/luci

      - name: Install theme package
        run: |
          cd openwrt
          mkdir -p feeds/luci/themes/luci-theme-mintzero
          cp -a "$GITHUB_WORKSPACE"/theme/* feeds/luci/themes/luci-theme-mintzero/

      - name: Install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd openwrt
          make defconfig

      - name: Enable theme in config
        run: |
          cd openwrt
          echo "CONFIG_PACKAGE_luci-theme-mintzero=m" >> .config
          make defconfig
          grep -q "CONFIG_PACKAGE_luci-theme-mintzero=m" .config || {
            echo "theme package not selectable"; exit 1;
          }

      - name: Build tools & toolchain
        run: |
          cd openwrt
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

      - name: Build theme package
        run: |
          cd openwrt
          make package/luci-theme-mintzero/compile V=s -j$(nproc) || \
            make package/luci-theme-mintzero/compile V=s -j1

      - name: Collect artifacts
        run: |
          cd openwrt
          mkdir -p "$GITHUB_WORKSPACE"/artifacts
          find bin/packages -name 'luci-theme-mintzero*' -exec cp {} "$GITHUB_WORKSPACE"/artifacts/ \;
          
          # Rename artifacts with version suffix for clarity
          cd "$GITHUB_WORKSPACE"/artifacts
          for file in *; do
            if [[ "${{ env.VERSION }}" != "nightly" ]]; then
              new_name="${file%.*}-${{ env.VERSION }}.${file##*.}"
              mv "$file" "$new_name"
            fi
          done
          ls -la "$GITHUB_WORKSPACE"/artifacts

      - name: Upload to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-mintzero-${{ matrix.suffix }}
          path: artifacts/*

      - name: Determine release info
        id: release_info
        run: |
          if [[ "${{ env.VERSION }}" == "nightly" ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "release_name=nightly" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "release_name=${{ env.VERSION }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ steps.release_info.outputs.release_name }}
          prerelease: ${{ steps.release_info.outputs.is_prerelease }}
          files: artifacts/*
          allowUpdates: ${{ env.VERSION == 'nightly' }}
          tag_overwrite: ${{ env.VERSION == 'nightly' }}
