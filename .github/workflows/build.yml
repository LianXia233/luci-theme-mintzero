name: Build Package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0, nightly)'
        required: false
        default: 'nightly'

permissions:
  contents: write

# Cancel superseded runs (e.g. a second push while the first is still building)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || (github.event.inputs.release_tag || 'nightly') }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86/64
            sdk_dir: x86/64
            suffix: x86_64
          - target: mediatek/filogic
            sdk_dir: mediatek/filogic
            suffix: mediatek_filogic

    steps:
      - name: Checkout this repo (theme sources)
        uses: actions/checkout@v4

      # This package is pure data (htdocs / root / ucode templates / po, no
      # src/), so luci.mk's Build/Compile is a no-op. Compiling the whole
      # OpenWrt tools + toolchain from source (~40-60 min) was pure waste:
      # the official prebuilt SDK ships the cross-toolchain + host tools, so
      # we only build luci-base/host (po2lmo + jsmin) and assemble the ipk.
      # Old flow: git clone openwrt.git + feeds update/install -a +
      # make tools/install + make toolchain/install  ->  new flow: SDK.

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Download prebuilt OpenWrt SDK
        run: |
          set -e
          base="https://downloads.openwrt.org/snapshots/targets/${{ matrix.sdk_dir }}"
          sdk=$(curl -fsSL "$base/" | grep -oE 'openwrt-sdk-[^"<]+\.tar\.zst' | head -n1)
          [ -n "$sdk" ] || { echo "::error::SDK tarball not found under $base"; exit 1; }
          echo "Downloading SDK: $sdk"
          curl -fsSLO "$base/$sdk" || { echo "::error::Failed to download $sdk"; exit 1; }
          echo "Extracting SDK ($(ls -lh "$sdk" | awk '{print $5}'))..."
          if tar --zstd -xf "$sdk" 2>&1; then
            echo "Successfully extracted with tar --zstd"
          else
            echo "tar --zstd failed, trying zstd + tar separately"
            zstd -d "$sdk" -o "${sdk%.zst}"
            tar -xf "${sdk%.zst}"
          fi
          echo "Renaming extracted directory..."
          ls -la | grep openwrt-sdk || { echo "::error::No openwrt-sdk directory found after extraction"; exit 1; }
          sdk_dir=$(ls -d openwrt-sdk-*/ 2>/dev/null | head -n1)
          [ -n "$sdk_dir" ] || { echo "::error::No openwrt-sdk directory found"; exit 1; }
          mv "$sdk_dir" sdk

      - name: Set up LuCI feed (luci only, no -a over all feeds)
        run: |
          cd sdk
          # Replace the SDK's multi-feed default with the single feed we need.
          echo "src-git luci https://github.com/openwrt/luci.git;master" > feeds.conf.default
          ./scripts/feeds update luci
          mkdir -p feeds/luci/themes/luci-theme-mintzero
          cp -a "$GITHUB_WORKSPACE"/theme/* feeds/luci/themes/luci-theme-mintzero/
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd sdk
          # JS minification stays on: jsmin ships with luci-base/host.
          # CSS minification (csstidy) lives in the large packages feed and is
          # deliberately disabled - pulling that feed would defeat this fast path.
          echo "CONFIG_PACKAGE_luci-theme-mintzero=m" >> .config
          echo "CONFIG_LUCI_JSMIN=y" >> .config
          echo "CONFIG_LUCI_CSSTIDY=n" >> .config
          make defconfig
          grep -q "CONFIG_PACKAGE_luci-theme-mintzero=m" .config || {
            echo "::error::theme package not selectable"; exit 1;
          }

      - name: Build theme package
        run: |
          cd sdk
          make package/feeds/luci/luci-theme-mintzero/compile V=s -j$(nproc)

      - name: Collect artifacts
        run: |
          cd sdk
          mkdir -p "$GITHUB_WORKSPACE"/artifacts
          find bin/packages -name 'luci-theme-mintzero*' -exec cp {} "$GITHUB_WORKSPACE"/artifacts/ \;

          # Rename artifacts with version suffix for clarity
          cd "$GITHUB_WORKSPACE"/artifacts
          for file in *; do
            if [[ "${{ env.VERSION }}" != "nightly" ]]; then
              new_name="${file%.*}-${{ env.VERSION }}.${file##*.}"
              mv "$file" "$new_name"
            fi
          done
          ls -la "$GITHUB_WORKSPACE"/artifacts

      - name: Upload to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-mintzero-${{ matrix.suffix }}
          path: artifacts/*

      - name: Determine release info
        id: release_info
        run: |
          if [[ "${{ env.VERSION }}" == "nightly" ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "release_name=nightly" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "release_name=${{ env.VERSION }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ steps.release_info.outputs.release_name }}
          prerelease: ${{ steps.release_info.outputs.is_prerelease }}
          files: artifacts/*
          allowUpdates: ${{ env.VERSION == 'nightly' }}
          tag_overwrite: ${{ env.VERSION == 'nightly' }}
